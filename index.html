<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Checklist</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0b1220;color:#e8edf2;min-height:100vh;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 18px) 18px 10px}
h1{font-size:22px;font-weight:700;letter-spacing:.2px}
.date{color:#8b98a9;font-size:13px;margin-top:2px}
.bar{height:6px;background:#1a2433;border-radius:3px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:#22c55e;border-radius:3px;transition:width .25s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8b98a9}
.newday{background:none;border:1px solid #2a3648;color:#8b98a9;font-size:12px;padding:5px 10px;border-radius:8px}
main{flex:1;overflow-y:auto;padding:10px 14px 90px}
.task{display:flex;align-items:center;gap:12px;background:#121b2a;border:1px solid #1e2a3d;border-radius:14px;padding:13px 14px;margin-bottom:9px}
.task.done{opacity:.55}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #2a3648;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#0b1220;transition:background .15s,border-color .15s}
.task.done .box{background:#22c55e;border-color:#22c55e;color:#08120a}
.task.done .txt{text-decoration:line-through;color:#8b98a9}
.txt{flex:1;font-size:15.5px;line-height:1.35;word-break:break-word}
.del{color:#5a6678;font-size:18px;padding:2px 6px;flex:none}
.empty{color:#5a6678;text-align:center;margin-top:60px;font-size:14px;line-height:1.6}
form{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,#0b1220 70%,rgba(11,18,32,0));display:flex;gap:9px}
input{flex:1;background:#121b2a;border:1px solid #1e2a3d;border-radius:12px;padding:13px 14px;color:#e8edf2;font-size:15px;outline:none}
input:focus{border-color:#22c55e}
button.add{background:#22c55e;border:none;color:#08120a;font-weight:700;font-size:15px;border-radius:12px;padding:0 20px}
</style>
</head>
<body>
<header>
  <h1>Daily Checklist</h1>
  <div class="date" id="date"></div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="meta"><span id="count">0 of 0 done</span><button class="newday" id="newday">New day</button></div>
</header>
<main id="list"></main>
<form id="form"><input id="input" placeholder="Add a task..." autocomplete="off" enterkeyhint="done"><button class="add" type="submit">Add</button></form>
<script>
const KEY='gm-checklist-v1';
let tasks=[];
try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
const list=document.getElementById('list');
const today=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
document.getElementById('date').textContent=today;
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  list.innerHTML='';
  if(!tasks.length){list.innerHTML='<div class="empty">No tasks yet.<br>Add your first one below.</div>'}
  tasks.forEach(t=>{
    const row=document.createElement('div');row.className='task'+(t.done?' done':'');
    row.innerHTML='<div class="box">'+(t.done?'✓':'')+'</div><div class="txt">'+esc(t.text)+'</div><div class="del">✕</div>';
    row.querySelector('.box').onclick=()=>{t.done=!t.done;save();render()};
    row.querySelector('.txt').onclick=()=>{t.done=!t.done;save();render()};
    row.querySelector('.del').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};
    list.appendChild(row);
  });
  const done=tasks.filter(t=>t.done).length;
  document.getElementById('bar').style.width=(tasks.length?done/tasks.length*100:0)+'%';
  document.getElementById('count').textContent=done+' of '+tasks.length+' done';
}
document.getElementById('form').onsubmit=e=>{
  e.preventDefault();
  const v=document.getElementById('input').value.trim();
  if(!v)return;
  tasks.push({id:Date.now()+''+Math.floor(Math.random()*999),text:v,done:false});
  document.getElementById('input').value='';
  save();render();
};
document.getElementById('newday').onclick=()=>{
  if(!tasks.length)return;
  tasks.forEach(t=>t.done=false);save();render();
};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
